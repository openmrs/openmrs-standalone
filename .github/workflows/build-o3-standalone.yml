name: Build O3 Standalone

on:
  # Rebuild on every push so the README's nightly.link download stays current:
  # nightly.link only serves artifacts from push/schedule-triggered runs, so
  # workflow_dispatch rebuilds are invisible to the download button.
  push:
    branches: [openmrs-emr3]
  workflow_dispatch:
    inputs:
      refapp_version:
        description: 'O3 Reference Application version'
        required: false
        default: '3.7.0-rc.3'
        type: string
      openmrs_version:
        description: 'OpenMRS Core version'
        required: false
        default: '2.8.7'
        type: string

concurrency:
  group: build-o3-standalone
  cancel-in-progress: true

env:
  REFAPP_VERSION: ${{ inputs.refapp_version || '3.7.0-rc.3' }}
  OPENMRS_VERSION: ${{ inputs.openmrs_version || '2.8.7' }}

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 4.x)
        run: corepack enable

      - name: Pre-run OpenMRS SDK Plugin
        run: mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk -B --settings .github/maven-settings.xml

      # Build the O3 standalone distribution. The 3.7.0-rc.3 distro defines exactly the
      # modules and versions to bundle. Docker init is skipped under -Pci; demo data ships
      # via the bundled src/main/db/demo-db-${REFAPP_VERSION}.sql dump. Tests run in
      # standalone-ci.yml.
      - name: Build standalone distribution
        run: |
          mvn clean package -Pci -B -DskipTests \
            --settings .github/maven-settings.xml \
            -Drefapp.version=$REFAPP_VERSION \
            -Dopenmrs.version=$OPENMRS_VERSION

      - name: Show the built standalone zip
        run: ls -lh "target/referenceapplication-standalone-${REFAPP_VERSION}.zip"

      # GitHub always re-zips whatever upload-artifact is handed. Uploading the standalone
      # .zip directly would yield a zip-inside-a-zip that users must extract twice. Extract
      # it here and upload the *contents* so GitHub's mandatory wrapper IS the standalone
      # zip — one extraction lands the runnable directory.
      - name: Stage extracted standalone for a single-extract artifact
        working-directory: target
        run: |
          ZIP="referenceapplication-standalone-${REFAPP_VERSION}.zip"
          rm -rf ~/.m2/repository || true
          unzip -q "$ZIP" -d artifact
          rm -f "$ZIP"
          echo "Artifact tree (extracts in one step):"
          ls -1 artifact

      # Pre-build ("bake") the Lucene search index so the downloaded standalone serves patient
      # and concept search instantly on first run, instead of paying the index-rebuild cost (and
      # showing empty search results) during first startup. We boot a THROWAWAY copy — never the
      # uploaded artifact — against its bundled demo DB; on first boot the standalone rebuilds the
      # index (no marker yet), and we copy only appdata/lucene back into the pristine artifact plus
      # a .prebuilt marker the standalone reads (OpenmrsUtil.hasPrebuiltSearchIndex) to skip the
      # rebuild. The published tree stays byte-identical to a normal build apart from that index.
      - name: Bake the Lucene search index into the demo appdata
        working-directory: target
        run: |
          set -uo pipefail
          ART="referenceapplication-standalone-${REFAPP_VERSION}"
          PRISTINE="$PWD/artifact/$ART"
          [ -d "$PRISTINE" ] || { echo "::error::artifact dir $PRISTINE not found"; ls -1 artifact; exit 1; }

          # The throwaway run dir MUST NOT live under /tmp (java.io.tmpdir): MariaDB4j deletes its
          # data dir on shutdown when it sits under java.io.tmpdir, which would wipe the imported
          # demo DB mid-run. $GITHUB_WORKSPACE is not under /tmp.
          BAKE="$GITHUB_WORKSPACE/bakerun/$ART"
          mkdir -p "$GITHUB_WORKSPACE/bakerun"
          rsync -a "$PRISTINE/" "$BAKE/" || { echo "::error::failed to stage throwaway copy under $BAKE"; exit 1; }
          cd "$BAKE" || { echo "::error::cannot cd into $BAKE"; exit 1; }

          LOG=/tmp/bake-standalone.log
          stop_server() {
            [ -f .standalone.pid ] && kill -TERM "$(cat .standalone.pid)" 2>/dev/null || true
            [ -n "${BOOT_PID:-}" ] && kill -TERM "$BOOT_PID" 2>/dev/null || true
            pkill -f 'org.openmrs.standalone.ApplicationController' 2>/dev/null || true
            pkill -f 'mariadbd' 2>/dev/null || true
          }
          fail() { echo "::error::$1"; echo "===== last 200 lines of standalone log ====="; tail -n 200 "$LOG" 2>/dev/null || true; stop_server; exit 1; }

          echo "Booting throwaway standalone to build the search index..."
          nohup java -jar openmrs-standalone.jar -commandline -noninteractive > "$LOG" 2>&1 &
          BOOT_PID=$!

          # The standalone triggers the rebuild on first boot; HibernateContextDAO logs this line
          # when the index is fully built.
          DONE=0
          for i in $(seq 1 120); do            # ceiling ~20 min
            kill -0 "$BOOT_PID" 2>/dev/null || fail "standalone process exited during index build"
            if grep -q "Finished updating the search index" "$LOG" 2>/dev/null; then DONE=1; break; fi
            echo "  ...building index (elapsed ~$((i*10))s)"
            sleep 10
          done
          [ "$DONE" = 1 ] || fail "search index build did not finish in time"

          LUCENE="$BAKE/appdata/lucene"
          { [ -d "$LUCENE/indexes" ] && [ -n "$(find "$LUCENE/indexes" -type f -print -quit)" ]; } \
            || fail "appdata/lucene/indexes was not populated"
          echo "Built index: $(du -sh "$LUCENE" | cut -f1)"

          # Functionally verify the baked index actually SERVES search (a present-but-empty index
          # would pass the file check yet ship broken search). Refuse to publish unless real
          # queries return hits. This is the gate that guarantees we never ship a standalone whose
          # search only works after a first-run rebuild.
          BASE="http://127.0.0.1:8081/openmrs"; AUTH="admin:Admin123"
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "$AUTH" "$BASE/ws/rest/v1/session" || true)" = 200 ] && break
            sleep 4
          done
          cnt() { curl -s -u "$AUTH" "$BASE/ws/rest/v1/$1" 2>/dev/null | python3 -c 'import json,sys;print(len(json.load(sys.stdin).get("results",[])))' 2>/dev/null || echo 0; }
          CONCEPTS=$(cnt 'concept?q=malaria&limit=3'); PATIENTS=$(cnt 'patient?q=Smith&limit=3')
          echo "Index serves search: concepts(malaria)=$CONCEPTS patients(Smith)=$PATIENTS"
          { [ "${CONCEPTS:-0}" -ge 1 ] && [ "${PATIENTS:-0}" -ge 1 ]; } 2>/dev/null \
            || fail "baked index present but search returned no hits (concepts=$CONCEPTS patients=$PATIENTS) — refusing to publish"

          echo "Stopping throwaway standalone..."
          stop_server
          for i in $(seq 1 30); do kill -0 "$BOOT_PID" 2>/dev/null || break; sleep 2; done
          kill -KILL "$BOOT_PID" 2>/dev/null || true

          # Copy ONLY the baked index into the pristine artifact, drop stale Lucene write locks,
          # and add the marker that tells the standalone to skip the first-run rebuild.
          SRC_COUNT=$(find "$LUCENE" -type f | wc -l | tr -d ' ')
          rm -rf "$PRISTINE/appdata/lucene"
          cp -a "$LUCENE" "$PRISTINE/appdata/lucene" || fail "failed to copy baked index into the artifact"
          find "$PRISTINE/appdata/lucene" -name 'write.lock' -delete 2>/dev/null || true
          DEST_COUNT=$(find "$PRISTINE/appdata/lucene" -type f | wc -l | tr -d ' ')
          { [ "$SRC_COUNT" -gt 0 ] && [ "$DEST_COUNT" -ge 1 ]; } \
            || fail "baked index copy incomplete: $DEST_COUNT files landed (src had $SRC_COUNT)"
          touch "$PRISTINE/appdata/lucene/.prebuilt"
          echo "Baked Lucene index into artifact ($DEST_COUNT files) + .prebuilt marker."
          rm -rf "$GITHUB_WORKSPACE/bakerun" 2>/dev/null || true

      # Hard gate: never publish a standalone that would rebuild its search index on first run.
      # If the bake above somehow did not leave a populated index + marker in the artifact, fail
      # the build here so nothing is uploaded.
      - name: Verify the baked search index is present (else fail the build)
        working-directory: target
        run: |
          P="artifact/referenceapplication-standalone-${REFAPP_VERSION}/appdata/lucene"
          [ -f "$P/.prebuilt" ] \
            || { echo "::error::.prebuilt marker missing — refusing to publish a standalone that would rebuild the index on first run"; exit 1; }
          N=$(find "$P/indexes" -type f 2>/dev/null | wc -l | tr -d ' ')
          [ "${N:-0}" -ge 1 ] \
            || { echo "::error::baked Lucene index is empty ($N files) — refusing to publish"; exit 1; }
          echo "Verified baked index in artifact: $N files + .prebuilt marker."

      - name: Upload standalone as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmrs-standalone-o3
          path: target/artifact
          # Keep parity with the original zip so no runtime config or appdata marker
          # (dotfiles) is silently dropped by v4's default hidden-file exclusion.
          include-hidden-files: true
          retention-days: 90
