name: Standalone 3.x Test CI

on:
  push:
    branches: [openmrs-emr3]
  pull_request:
    branches: [openmrs-emr3]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: on Linux (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Verify Docker Compose installation
        run: docker compose version

      - name: Pre-run OpenMRS SDK Plugin
        run: mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk -B --settings .github/maven-settings.xml

      - name: Run Maven Clean
        run: mvn clean --settings .github/maven-settings.xml

      - name: Run Maven Install
        run: mvn install --settings .github/maven-settings.xml

      # Guard against the silent packaging regression behind "No suitable driver found for
      # jdbc:mariadb://": the jar-with-dependencies assembly must MERGE
      # META-INF/services/java.sql.Driver (see src/main/assembly/jar-with-dependencies.xml) so the
      # MariaDB driver auto-registers via the JDBC ServiceLoader. If a future change drops it, the
      # jar still builds clean and the failure only surfaces at runtime - so fail loudly here.
      - name: Verify MariaDB JDBC driver is registered in the standalone jar
        run: |
          JAR=target/openmrs-standalone.jar
          [ -f "$JAR" ] || { echo "::error::$JAR not found"; exit 1; }
          SERVICES=$(unzip -p "$JAR" META-INF/services/java.sql.Driver || true)
          echo "java.sql.Driver service file:"; echo "$SERVICES"
          echo "$SERVICES" | grep -qxF 'org.mariadb.jdbc.Driver' \
            || { echo "::error::org.mariadb.jdbc.Driver missing from the standalone jar's java.sql.Driver service file - jdbc:mariadb connections would fail at runtime with 'No suitable driver found'"; exit 1; }
          echo "OK: MariaDB JDBC driver is registered via the merged service file."

  build-windows:
    name: on Windows (Java 21)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Pre-run OpenMRS SDK Plugin
        run: mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk -B --settings .github/maven-settings.xml

      - name: Run Maven Clean
        run: mvn clean --settings .github/maven-settings.xml

      - name: Run Maven Install
        run: mvn install -Pci --settings .github/maven-settings.xml

  build-macos:
    name: on macOS (Java 21)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Pre-run OpenMRS SDK Plugin
        run: mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk -B --settings .github/maven-settings.xml

      - name: Run Maven Clean
        run: mvn clean --settings .github/maven-settings.xml

      - name: Run Maven Install
        run: mvn install -Pci --settings .github/maven-settings.xml